<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>RTT/1 Example Suite Graph Dashboard</title><style>body{font-family:sans-serif;padding:20px}.p{border:1px solid #ccc;padding:12px;margin-bottom:16px}pre{background:#f7f7f7;padding:10px;overflow-x:auto}</style></head><body><h1>RTT/1 Example Suite Graph Dashboard</h1><div id="root"></div><script type="module">import{exampleSuiteGraph as g}from"./example-suite.graph.js";const x=g(),r=document.getElementById("root");let h="";x.nodes.forEach(n=>{h+=`<div class="p"><h2>Node: ${n.id}</h2><pre>${JSON.stringify(n.payload,null,2)}</pre><h3>Clarity Surface</h3><pre>${JSON.stringify(n.clarity_surface,null,2)}</pre><h3>Clarity Scan</h3><pre>${JSON.stringify(n.clarity_scan,null,2)}</pre></div>`});h+=`<div class="p"><h2>Edges</h2><pre>${JSON.stringify(x.edges,null,2)}</pre></div>`;r.innerHTML=h;</script></body></html>
