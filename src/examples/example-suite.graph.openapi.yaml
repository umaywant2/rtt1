openapi: 3.1.0
info:
  title: RTT/1 Example Suite Graph API
  version: 1.0.0-alpha
  description: >
    Strict RTT/1 example suite graph endpoint. Returns nodes, edges,
    clarity_surface, and clarity_scan for each node.

paths:
  /examples/suite/graph:
    get:
      summary: Return strict RTT/1 example suite graph
      operationId: exampleSuiteGraphStrict
      responses:
        "200":
          description: Strict example suite graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleSuiteGraphStrict"

components:
  schemas:

    ExampleSuiteGraphStrict:
      type: object
      required: ["nodes", "edges"]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphNodeStrict"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphEdgeStrict"

    ExampleSuiteGraphNodeStrict:
      type: object
      required: ["id", "payload", "clarity_surface", "clarity_scan"]
      properties:
        id: { type: "string" }
        label: { type: ["string", "null"] }
        payload:
          type: object
          additionalProperties: true
        clarity_surface:
          type: object
        clarity_scan:
          type: object

    ExampleSuiteGraphEdgeStrict:
      type: object
      required: ["from", "to"]
      properties:
        from: { type: "string" }
        to: { type: "string" }
        label: { type: ["string", "null"] }
