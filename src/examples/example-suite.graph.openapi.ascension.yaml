openapi: 3.1.0
info:
  title: RTT/1 Example Suite Graph API (Ascension)
  version: 1.0.0-alpha
  description: >
    Ascension-tier RTT/1 example suite graph endpoint. Includes nodes,
    edges, clarity_surface, clarity_scan, session metadata, geometry,
    anchors, ascension regime, recursive invariants, cross-tier propagation,
    ascendant signature, and structural ascent vector.

paths:
  /examples/suite/graph/ascension:
    get:
      summary: Return ascension RTT/1 example suite graph
      operationId: exampleSuiteGraphAscension
      responses:
        "200":
          description: Ascension example suite graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleSuiteGraphAscension"

components:
  schemas:

    ExampleSuiteGraphAscension:
      type: object
      required:
        - engine
        - version
        - session
        - nodes
        - edges
        - geometry
        - meta
        - signature
        - ascent_vector
      properties:
        engine: { type: "string" }
        version: { type: "string" }

        session:
          type: object
          properties:
            rtt: { type: "number" }
            coherence: { type: "string" }
            drift: { type: "string" }
            paradox: { type: "string" }
            singularity: { type: "boolean" }
            transcendence: { type: "boolean" }
            apotheosis: { type: "boolean" }
            ascension: { type: "boolean" }

        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphNodeAscension"

        edges:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphEdgeAscension"

        geometry:
          type: object
          properties:
            shape: { type: "string" }
            anchors:
              type: array
              items: { type: "string" }
            regime: { type: "string" }
            collapse: { type: "string" }
            dimensionality: { type: "string" }
            invariant: { type: "string" }

        meta:
          type: object
          properties:
            tier: { type: "string" }
            strictness: { type: "string" }
            completeness: { type: "string" }
            finality: { type: "string" }
            self_similarity: { type: "string" }
            recursion: { type: "string" }
            propagation: { type: "string" }

        signature:
          type: object
          properties:
            description: { type: "string" }
            hash: { type: "string" }
            invariant: { type: "boolean" }
            recursive: { type: "boolean" }
            ascendant: { type: "boolean" }

        ascent_vector:
          type: object
          properties:
            description: { type: "string" }
            direction: { type: "string" }
            magnitude: { type: "string" }
            continuity: { type: "string" }

    ExampleSuiteGraphNodeAscension:
      type: object
      required: ["id","payload","clarity_surface","clarity_scan"]
      properties:
        id: { type: "string" }
        label: { type: ["string","null"] }
        payload:
          type: object
          additionalProperties: true
        clarity_surface:
          type: "object"
        clarity_scan:
          type: "object"

    ExampleSuiteGraphEdgeAscension:
      type: object
      required: ["from","to"]
      properties:
        from: { type: "string" }
        to: { type: "string" }
        label: { type: ["string","null"] }

