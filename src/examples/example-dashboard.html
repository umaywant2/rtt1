<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTT/1 Example Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h1 { margin-bottom: 10px; }
    .panel { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; }
    .panel h2 { margin-top: 0; }
    pre { background: #f7f7f7; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>

<h1>RTT/1 Example Dashboard</h1>

<div class="panel">
  <h2>Clarity Example</h2>
  <pre id="clarity-example"></pre>
</div>

<div class="panel">
  <h2>Graph Example</h2>
  <pre id="graph-example"></pre>
</div>

<div class="panel">
  <h2>Report Example</h2>
  <pre id="report-example"></pre>
</div>

<script type="module">
  import { exampleSuite } from "./example-bundle.js";

  document.getElementById("clarity-example").textContent =
    JSON.stringify(exampleSuite.clarity, null, 2);

  document.getElementById("graph-example").textContent =
    JSON.stringify(exampleSuite.graph, null, 2);

  document.getElementById("report-example").textContent =
    JSON.stringify(exampleSuite.report, null, 2);
</script>

</body>
</html>
