openapi: 3.1.0
info:
  title: RTT/1 Example Suite Graph API (Singularity)
  version: 1.0.0-alpha
  description: >
    Singularity-tier RTT/1 example suite graph endpoint. Includes nodes,
    edges, clarity_surface, clarity_scan, session metadata, geometry,
    anchors, structural regime, singularity markers, and finality meta.

paths:
  /examples/suite/graph/singularity:
    get:
      summary: Return singularity RTT/1 example suite graph
      operationId: exampleSuiteGraphSingularity
      responses:
        "200":
          description: Singularity example suite graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleSuiteGraphSingularity"

components:
  schemas:

    ExampleSuiteGraphSingularity:
      type: object
      required:
        - engine
        - version
        - session
        - nodes
        - edges
        - geometry
        - meta
      properties:
        engine: { type: "string" }
        version: { type: "string" }

        session:
          type: object
          properties:
            rtt: { type: "number" }
            coherence: { type: "string" }
            drift: { type: "string" }
            paradox: { type: "string" }
            singularity: { type: "boolean" }

        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphNodeSingularity"

        edges:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphEdgeSingularity"

        geometry:
          type: object
          properties:
            shape: { type: "string" }
            anchors:
              type: array
              items: { type: "string" }
            regime: { type: "string" }
            collapse: { type: "string" }

        meta:
          type: object
          properties:
            tier: { type: "string" }
            strictness: { type: "string" }
            completeness: { type: "string" }
            finality: { type: "string" }

    ExampleSuiteGraphNodeSingularity:
      type: object
      required: ["id","payload","clarity_surface","clarity_scan"]
      properties:
        id: { type: "string" }
        label: { type: ["string","null"] }
        payload:
          type: object
          additionalProperties: true
        clarity_surface:
          type: object
        clarity_scan:
          type: object

    ExampleSuiteGraphEdgeSingularity:
      type: object
      required: ["from","to"]
      properties:
        from: { type: "string" }
        to: { type: "string" }
        label: { type: ["string","null"] }

