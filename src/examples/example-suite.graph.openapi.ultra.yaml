openapi: 3.1.0
info:
  title: RTT/1 Example Suite Graph API (Ultra)
  version: 1.0.0-alpha
  description: >
    Ultra‑strict RTT/1 example suite graph endpoint including nodes,
    edges, clarity_surface, clarity_scan, session metadata, geometry,
    and structural anchors.

paths:
  /examples/suite/graph/ultra:
    get:
      summary: Return ultra RTT/1 example suite graph
      operationId: exampleSuiteGraphUltra
      responses:
        "200":
          description: Ultra example suite graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleSuiteGraphUltra"

components:
  schemas:

    ExampleSuiteGraphUltra:
      type: object
      required: ["engine","version","session","nodes","edges","geometry"]
      properties:
        engine: { type: "string" }
        version: { type: "string" }
        session:
          type: object
          properties:
            rtt: { type: "number" }
            coherence: { type: "string" }
            drift: { type: "string" }
            paradox: { type: "string" }

        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphNodeUltra"

        edges:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphEdgeUltra"

        geometry:
          type: object
          properties:
            shape: { type: "string" }
            anchors:
              type: array
              items: { type: "string" }

    ExampleSuiteGraphNodeUltra:
      type: object
      required: ["id","payload","clarity_surface","clarity_scan"]
      properties:
        id: { type: "string" }
        label: { type: ["string","null"] }
        payload:
          type: object
          additionalProperties: true
        clarity_surface:
          type: object
        clarity_scan:
          type: object

    ExampleSuiteGraphEdgeUltra:
      type: object
      required: ["from","to"]
      properties:
        from: { type: "string" }
        to: { type: "string" }
        label: { type: ["string","null"] }

