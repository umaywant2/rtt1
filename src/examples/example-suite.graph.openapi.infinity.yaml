openapi: 3.1.0
info:
  title: RTT/1 Example Suite Graph API (Infinity)
  version: 1.0.0-alpha
  description: >
    Infinity‑tier RTT/1 example suite graph endpoint. Includes nodes,
    edges, clarity_surface, clarity_scan, session metadata, geometry,
    anchors, structural regime, and infinity‑grade metadata.

paths:
  /examples/suite/graph/infinity:
    get:
      summary: Return infinity RTT/1 example suite graph
      operationId: exampleSuiteGraphInfinity
      responses:
        "200":
          description: Infinity example suite graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleSuiteGraphInfinity"

components:
  schemas:

    ExampleSuiteGraphInfinity:
      type: object
      required: ["engine","version","session","nodes","edges","geometry","meta"]
      properties:
        engine: { type: "string" }
        version: { type: "string" }

        session:
          type: object
          properties:
            rtt: { type: "number" }
            coherence: { type: "string" }
            drift: { type: "string" }
            paradox: { type: "string" }

        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphNodeInfinity"

        edges:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphEdgeInfinity"

        geometry:
          type: object
          properties:
            shape: { type: "string" }
            anchors:
              type: array
              items: { type: "string" }
            regime: { type: "string" }

        meta:
          type: object
          properties:
            tier: { type: "string" }
            strictness: { type: "string" }

    ExampleSuiteGraphNodeInfinity:
      type: object
      required: ["id","payload","clarity_surface","clarity_scan"]
      properties:
        id: { type: "string" }
        label: { type: ["string","null"] }
        payload:
          type: object
          additionalProperties: true
        clarity_surface:
          type: object
        clarity_scan:
          type: object

    ExampleSuiteGraphEdgeInfinity:
      type: object
      required: ["from","to"]
      properties:
        from: { type: "string" }
        to: { type: "string" }
        label: { type: ["string","null"] }

