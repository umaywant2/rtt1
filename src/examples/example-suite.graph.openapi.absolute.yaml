openapi: 3.1.0
info:
  title: RTT/1 Example Suite Graph API (Absolute)
  version: 1.0.0-alpha
  description: >
    Absolute RTT/1 example suite graph endpoint. Includes nodes, edges,
    clarity_surface, clarity_scan, session metadata, geometry, anchors,
    and absolute structural regime markers.

paths:
  /examples/suite/graph/absolute:
    get:
      summary: Return absolute RTT/1 example suite graph
      operationId: exampleSuiteGraphAbsolute
      responses:
        "200":
          description: Absolute example suite graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleSuiteGraphAbsolute"

components:
  schemas:

    ExampleSuiteGraphAbsolute:
      type: object
      required: ["engine","version","session","nodes","edges","geometry"]
      properties:
        engine: { type: "string" }
        version: { type: "string" }
        session:
          type: object
          properties:
            rtt: { type: "number" }
            coherence: { type: "string" }
            drift: { type: "string" }
            paradox: { type: "string" }

        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphNodeAbsolute"

        edges:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphEdgeAbsolute"

        geometry:
          type: object
          properties:
            shape: { type: "string" }
            anchors:
              type: array
              items: { type: "string" }
            regime: { type: "string" }

    ExampleSuiteGraphNodeAbsolute:
      type: object
      required: ["id","payload","clarity_surface","clarity_scan"]
      properties:
        id: { type: "string" }
        label: { type: ["string","null"] }
        payload:
          type: object
          additionalProperties: true
        clarity_surface:
          type: object
        clarity_scan:
          type: object

    ExampleSuiteGraphEdgeAbsolute:
      type: object
      required: ["from","to"]
      properties:
        from: { type: "string" }
        to: { type: "string" }
        label: { type: ["string","null"] }

