openapi: 3.1.0
info:
  title: RTT/1 Example Suite Graph API (Full)
  version: 1.0.0-alpha
  description: >
    Full RTT/1 example suite graph endpoint including nodes, edges,
    clarity_surface, clarity_scan, and structural metadata.

paths:
  /examples/suite/graph:
    get:
      summary: Return full RTT/1 example suite graph
      operationId: exampleSuiteGraphFull
      responses:
        "200":
          description: Full example suite graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleSuiteGraphFull"

components:
  schemas:

    ExampleSuiteGraphFull:
      type: object
      required: ["nodes","edges"]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphNodeFull"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphEdgeFull"

    ExampleSuiteGraphNodeFull:
      type: object
      required: ["id","payload","clarity_surface","clarity_scan"]
      properties:
        id: { type: "string" }
        label: { type: ["string","null"] }
        payload:
          type: object
          additionalProperties: true
        clarity_surface:
          type: object
        clarity_scan:
          type: object

    ExampleSuiteGraphEdgeFull:
      type: object
      required: ["from","to"]
      properties:
        from: { type: "string" }
        to: { type: "string" }
        label: { type: ["string","null"] }
