openapi: 3.1.0
info:
  title: RTT/1 Example Suite Graph API (Apotheosis)
  version: 1.0.0-alpha
  description: >
    Apotheosis-tier RTT/1 example suite graph endpoint. Includes nodes,
    edges, clarity_surface, clarity_scan, session metadata, geometry,
    anchors, apotheosis regime, transcendence markers, recursive invariants,
    and apotheotic structural signature.

paths:
  /examples/suite/graph/apotheosis:
    get:
      summary: Return apotheosis RTT/1 example suite graph
      operationId: exampleSuiteGraphApotheosis
      responses:
        "200":
          description: Apotheosis example suite graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleSuiteGraphApotheosis"

components:
  schemas:

    ExampleSuiteGraphApotheosis:
      type: object
      required:
        - engine
        - version
        - session
        - nodes
        - edges
        - geometry
        - meta
        - signature
      properties:
        engine: { type: "string" }
        version: { type: "string" }

        session:
          type: object
          properties:
            rtt: { type: "number" }
            coherence: { type: "string" }
            drift: { type: "string" }
            paradox: { type: "string" }
            singularity: { type: "boolean" }
            transcendence: { type: "boolean" }
            apotheosis: { type: "boolean" }

        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphNodeApotheosis"

        edges:
          type: array
          items:
            $ref: "#/components/schemas/ExampleSuiteGraphEdgeApotheosis"

        geometry:
          type: object
          properties:
            shape: { type: "string" }
            anchors:
              type: array
              items: { type: "string" }
            regime: { type: "string" }
            collapse: { type: "string" }
            dimensionality: { type: "string" }
            invariant: { type: "string" }

        meta:
          type: object
          properties:
            tier: { type: "string" }
            strictness: { type: "string" }
            completeness: { type: "string" }
            finality: { type: "string" }
            self_similarity: { type: "string" }
            recursion: { type: "string" }

        signature:
          type: object
          properties:
            description: { type: "string" }
            hash: { type: "string" }
            invariant: { type: "boolean" }
            recursive: { type: "boolean" }

    ExampleSuiteGraphNodeApotheosis:
      type: object
      required: ["id","payload","clarity_surface","clarity_scan"]
      properties:
        id: { type: "string" }
        label: { type: ["string","null"] }
        payload:
          type: object
          additionalProperties: true
        clarity_surface:
          type: "object"
        clarity_scan:
          type: "object"

    ExampleSuiteGraphEdgeApotheosis:
      type: object
      required: ["from","to"]
      properties:
        from: { type: "string" }
        to: { type: "string" }
        label: { type: ["string","null"] }

