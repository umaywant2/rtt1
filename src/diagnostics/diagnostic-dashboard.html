<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTT/1 Diagnostic Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h1 { margin-bottom: 10px; }
    .panel { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    .panel h2 { margin-top: 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>

<h1>RTT/1 Diagnostic Dashboard</h1>

<div class="panel">
  <h2>Summary</h2>
  <p>Displays issues, warnings, and stats from the RTT/1 diagnostic engine.</p>
</div>

<div class="panel">
  <h2>Diagnostics Table</h2>
  <div id="diagnostic-table"></div>
</div>

<div class="panel">
  <h2>Graph Diagnostics</h2>
  <div id="diagnostic-graph"></div>
</div>

</body>
</html>
