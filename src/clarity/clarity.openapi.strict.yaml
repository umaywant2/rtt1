openapi: 3.1.0
info:
  title: RTT/1 Clarity API (Strict)
  version: 1.0.0-alpha
  description: >
    Strict RTT/1 clarity engine API: clarity-surface + clarity-scan + diagnostics.

servers:
  - url: local
    description: Browser or worker execution

paths:
  /clarity:
    post:
      summary: Extract strict RTT/1 clarity surface + scan
      operationId: clarityStrict
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClarityInputStrict"
      responses:
        "200":
          description: Strict RTT/1 clarity output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClarityOutputStrict"

components:
  schemas:

    ClarityInputStrict:
      type: object
      additionalProperties: true

    ClaritySurfaceStrict:
      type: object
      required: ["summary", "signals", "operators", "coherence", "drift", "paradox"]
      properties:
        summary: { type: ["string", "null"] }
        signals:
          type: array
          minItems: 0
          items: { type: "string" }
        operators:
          type: array
          minItems: 0
          items: { type: "string" }
        coherence: { type: ["string", "null"] }
        drift: { type: ["string", "null"] }
        paradox: { type: ["string", "null"] }

    ClarityScanStrict:
      type: object
      required: ["anchors", "tensions", "gaps", "load_bearing", "stability"]
      properties:
        anchors:
          type: array
          items: { type: "string" }
        tensions:
          type: array
          items: { type: "string" }
        gaps:
          type: array
          items: { type: "string" }
        load_bearing:
          type: array
          items: { type: "string" }
        stability:
          type: string

    DiagnosticsStrict:
      type: object
      required: ["issues", "warnings", "stats"]
      properties:
        issues:
          type: array
          items: { type: "string" }
        warnings:
          type: array
          items: { type: "string" }
        stats:
          type: object
          required: ["timestamp", "length"]
          properties:
            timestamp: { type: "number" }
            length: { type: "number" }

    ClarityOutputStrict:
      type: object
      required: ["clarity_surface", "clarity_scan", "diagnostics"]
      properties:
        clarity_surface:
          $ref: "#/components/schemas/ClaritySurfaceStrict"
        clarity_scan:
          $ref: "#/components/schemas/ClarityScanStrict"
        diagnostics:
          $ref: "#/components/schemas/DiagnosticsStrict"

    ErrorOutputStrict:
      type: object
      properties:
        error: { type: "string" }

