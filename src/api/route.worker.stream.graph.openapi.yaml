openapi: 3.1.0
info:
  title: RTT/1 Hybrid Graph + Streaming Worker API (Strict)
  version: 1.0.0-alpha
  description: >
    Strict hybrid graph + streaming worker API surface for RTT/1 substrate extraction.
    Enforces strict typing, required fields, and canonical RTT/1 output structure.

servers:
  - url: local
    description: Worker-thread execution (no network transport)

paths:
  /graph-analyze:
    post:
      summary: Strict hybrid graph + streaming RTT/1 analysis
      operationId: strictStreamGraphAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphInputStrict"
      responses:
        "200":
          description: Strict graph-shaped hybrid analysis output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphHybridOutputStrict"

  /graph-report:
    post:
      summary: Strict RTT/1 report generation per node
      operationId: strictStreamGraphReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphInputStrict"
      responses:
        "200":
          description: Strict graph-shaped report output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphReportOutputStrict"

  /stream-chunk:
    post:
      summary: Strict chunk streaming
      operationId: strictStreamChunk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamInputStrict"
      responses:
        "200":
          description: Strict combined streaming output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamOutputStrict"

  /meta:
    get:
      summary: Strict hybrid worker metadata
      operationId: strictStreamGraphMeta
      responses:
        "200":
          description: Strict metadata block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaOutputStrict"

components:
  schemas:

    GraphInputStrict:
      type: object
      required: ["graph"]
      properties:
        graph:
          type: object
          required: ["nodes", "edges"]
          properties:
            nodes:
              type: array
              minItems: 1
              items:
                type: object
                required: ["id", "payload"]
                properties:
                  id: { type: "string" }
                  label: { type: ["string", "null"] }
                  payload:
                    type: object
                    additionalProperties: true
            edges:
              type: array
              items:
                type: object
                required: ["from", "to"]
                properties:
                  from: { type: "string" }
                  to: { type: "string" }

    StreamInputStrict:
      type: object
      required: ["chunks"]
      properties:
        chunks:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true

    StreamOutputStrict:
      type: object
      required: ["substrate"]
      properties:
        substrate:
          type: object
          required: ["signals", "operators"]
          properties:
            signals:
              type: array
              items: { type: "string" }
            operators:
              type: array
              items: { type: "string" }

    GraphHybridOutputStrict:
      type: object
      required: ["nodes", "edges"]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: ["id", "report"]
            properties:
              id: { type: "string" }
              label: { type: ["string", "null"] }
              streamed:
                $ref: "#/components/schemas/StreamOutputStrict"
              analysis:
                $ref: "#/components/schemas/AnalysisOutputStrict"
              report:
                $ref: "#/components/schemas/ReportOutputStrict"
        edges:
          type: array
          items:
            type: object
            required: ["from", "to"]
            properties:
              from: { type: "string" }
              to: { type: "string" }

    GraphReportOutputStrict:
      type: object

    AnalysisOutputStrict:
      type: object

    ReportOutputStrict:
      type: object

    MetaOutputStrict:
      type: object
      required: ["rtt", "module", "version", "environment", "endpoints"]
      properties:
        rtt: { type: "number" }
        module: { type: "string" }
        version: { type: "string" }
        environment: { type: "string" }
        endpoints:
          type: array
          items: { type: "string" }

    ErrorOutputStrict:
      type: object
      required: ["error"]
      properties:
        error: { type: "string" }
